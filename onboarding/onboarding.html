<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to STILL.</title>
    <link rel="icon" href="../assets/icons/icon-32.png" />
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body>
    <header class="ob-top">
      <div class="logo ob-logo">STILL<i>.</i></div>
      <div class="ob-progress" aria-hidden="true">
        <div class="ob-steps" id="steps"></div>
        <div class="ob-bar"><span id="bar"></span></div>
      </div>
      <div class="ob-count muted small" id="count"></div>
    </header>

    <main id="stage" class="ob-stage" tabindex="-1"></main>

    <footer class="ob-foot" id="foot">
      <button class="btn ghost" id="back" type="button">Back</button>
      <div class="ob-foot-note muted small" id="footNote"></div>
      <button class="btn primary lg" id="next" type="button">Continue</button>
    </footer>

    <script src="../shared/defaults.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="../shared/message-engine.js"></script>
    <script src="../shared/media.js"></script>
    <script src="../content/overlay-styles.js"></script>
    <script src="../content/animation-engine.js"></script>
    <script src="../content/overlay.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="../shared/components.js"></script>
    <script src="../shared/studio.js"></script>
    <script src="../shared/insights.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
